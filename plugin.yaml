name: agentiker-scout
version: 0.6.8
description: "Unified analysis, bug-hunt, and web-research plugin. 71 bug patterns, 42 ops in 3 namespace dispatchers (analysis, bughunt, research)."
author: agentiker
license: MIT
requires_hermes: ">=0.23.1"
repo: https://git.agentiker.de/johannes/agentiker-scout
python_dependencies:
  - "PyYAML>=6.0,<7"
  - "packaging>=23.0,<27"

manifest_version: 2
provides_tools:
  - analysis
  - bughunt
  - research
provides_hooks:
  - on_session_end
  - post_tool_call
  - pre_llm_call
